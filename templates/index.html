<!DOCTYPE html>
<html lang="en">
<head>
{{template "head" "Artists"}}
</head>
<body>
{{template "header"}}
  <main>
    <section class="intro">
      <h1>Artists on tour</h1>
      <p>{{len .}} artists, rated by the Activity Classifier from Emerging to Legendary.</p>
    </section>

    <ul class="cards">
      {{range .}}
      <li class="card">
        <a href="/artist/{{.ID}}">
          <img src="{{.Image}}" alt="{{.Name}}" width="300" height="300" loading="lazy">
          <div class="card-body">
            <h2>{{.Name}}</h2>
            <p class="meta">Since {{.CreationDate}} · {{.ConcertCount}} concerts</p>
            <span class="badge badge-{{lower .Label}}">{{.Label}}</span>
          </div>
        </a>
      </li>
      {{end}}
    </ul>
  </main>
</body>
</html>
