<!DOCTYPE html>
<html lang="en">
<head>
{{template "head" (printf "%d %s" .Status .Title)}}
</head>
<body>
{{template "header"}}
  <main class="error">
    <p class="error-code">{{.Status}}</p>
    <h1>{{.Title}}</h1>
    <p>{{.Message}}</p>
    <a class="button" href="/">← Back to all artists</a>
  </main>
</body>
</html>
